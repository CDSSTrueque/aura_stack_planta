[options]
addons_path = /mnt/extra-addons/odoo_aura_plant,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
; Odoo 20 escucha por defecto solo en 127.0.0.1; dentro del contenedor eso
; deja el puerto publicado (8169) sin respuesta. Docker ya limita la exposicion.
http_interface = 0.0.0.0
db_host = db
db_port = 5432
db_user = odoo
db_name = odoo
; No listar/crear otras bases desde la web
dbfilter = ^odoo$
list_db = False
; Cambiar esta contraseña
admin_passwd = cambiar_esto_master
; Detras de Caddy: respetar X-Forwarded-Proto/Host (http en :8169, https en planta.aura).
proxy_mode = True
workers = 2
limit_time_cpu = 600
limit_time_real = 1200
