# Nombre de proyecto explicito. Compose lo deriva del nombre de la carpeta,
# asi que renombrar o mover la carpeta crearia un proyecto nuevo con
# volumenes vacios y dejaria los datos viejos huerfanos. Fijandolo aqui,
# la carpeta se puede mover sin consecuencias.
name: aura_stack_planta

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: aura_db
    environment:
      POSTGRES_USER: ${PG_SUPERUSER}
      POSTGRES_PASSWORD: ${PG_SUPERPASSWORD}
      POSTGRES_DB: postgres
      ODOO_PG_PASSWORD: ${ODOO_PG_PASSWORD}
      NODERED_PG_PASSWORD: ${NODERED_PG_PASSWORD}
    # Solo localhost: Node-RED nativo lo alcanza, la red de planta no.
    # Host 5433 (5432 lo ocupa el contenedor de desarrollo odoo-vm).
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  odoo:
    # Imagen propia: odoo:19 + driver ODBC 18 + pyodbc (ver odoo/Dockerfile).
    build: ./odoo
    image: aura_odoo:19
    container_name: aura_odoo
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${ODOO_PG_PASSWORD}
    ports:
      - "8169:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./extra-addons:/mnt/extra-addons          # bind: aquí edítas tu módulo
    restart: unless-stopped

volumes:
  pgdata:
  odoo-data:
